<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workflow Diagram</title>
  <desc id="desc">A workflow diagram showing how LINE messages are routed through state lookup, intent routing, bounded AI replies, questionnaire handling, admin review, scheduled follow-up tasks, and database persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8a4a5d"/>
    </marker>
    <style>
      .bg { fill: #fffafa; }
      .lane { fill: #fff5f7; stroke: #ead5dc; stroke-width: 1.5; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #5e2f3d; }
      .box { fill: #ffffff; stroke: #bf7a8d; stroke-width: 1.8; rx: 10; }
      .decision { fill: #fffdf8; stroke: #b8865b; stroke-width: 1.8; }
      .store { fill: #f4fbf8; stroke: #6aa990; stroke-width: 1.8; rx: 10; }
      .human { fill: #f7f3ff; stroke: #8b77bd; stroke-width: 1.8; rx: 10; }
      .task { fill: #f8fbff; stroke: #6f93bf; stroke-width: 1.8; rx: 10; }
      .label { font: 700 15px Arial, sans-serif; fill: #2c2528; }
      .small { font: 13px Arial, sans-serif; fill: #62565a; }
      .note { font: 12px Arial, sans-serif; fill: #7a6870; }
      .line { fill: none; stroke: #8a4a5d; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8a4a5d; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .muted { fill: none; stroke: #c8a8b2; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="760"/>
  <text x="42" y="46" style="font: 800 28px Arial, sans-serif; fill: #4e2633;">Agent Workflow</text>
  <text x="42" y="74" class="small">AI replies are bounded by product rules, while workflow state and sensitive actions stay on the server side.</text>

  <rect class="lane" x="34" y="104" width="340" height="596" rx="18"/>
  <text x="60" y="138" class="lane-title">User &amp; LINE Entry</text>

  <rect class="lane" x="420" y="104" width="340" height="596" rx="18"/>
  <text x="446" y="138" class="lane-title">Server Workflow Boundary</text>

  <rect class="lane" x="806" y="104" width="340" height="596" rx="18"/>
  <text x="832" y="138" class="lane-title">Operations &amp; Storage</text>

  <rect class="box" x="72" y="170" width="238" height="74"/>
  <text x="92" y="200" class="label">LINE message</text>
  <text x="92" y="222" class="small">Course inquiry or reply</text>

  <rect class="box" x="72" y="292" width="238" height="74"/>
  <text x="92" y="322" class="label">Webhook verification</text>
  <text x="92" y="344" class="small">Validate LINE source</text>

  <rect class="store" x="458" y="170" width="238" height="74"/>
  <text x="478" y="200" class="label">Load customer state</text>
  <text x="478" y="222" class="small">Profile, progress, tasks</text>

  <polygon class="decision" points="577,292 706,352 577,412 448,352"/>
  <text x="524" y="344" class="label">Route intent</text>
  <text x="500" y="366" class="small">AI, questionnaire,</text>
  <text x="516" y="385" class="small">admin, follow-up</text>

  <rect class="box" x="458" y="462" width="238" height="76"/>
  <text x="478" y="492" class="label">Bounded AI reply</text>
  <text x="478" y="514" class="small">Rules + prompt guardrails</text>

  <rect class="task" x="72" y="508" width="238" height="76"/>
  <text x="92" y="538" class="label">Reply to LINE</text>
  <text x="92" y="560" class="small">Customer-facing response</text>

  <rect class="task" x="842" y="170" width="238" height="76"/>
  <text x="862" y="200" class="label">Questionnaire flow</text>
  <text x="862" y="222" class="small">Structured course intake</text>

  <rect class="human" x="842" y="292" width="238" height="76"/>
  <text x="862" y="322" class="label">Admin workbench</text>
  <text x="862" y="344" class="small">Staff review and actions</text>

  <rect class="task" x="842" y="414" width="238" height="76"/>
  <text x="862" y="444" class="label">Scheduled follow-up</text>
  <text x="862" y="466" class="small">Reminder and care tasks</text>

  <rect class="store" x="842" y="548" width="238" height="88"/>
  <text x="862" y="580" class="label">Supabase records</text>
  <text x="862" y="602" class="small">State, records, tasks,</text>
  <text x="862" y="622" class="small">admin sessions</text>

  <path class="line" d="M191 244 L191 292"/>
  <path class="line" d="M310 329 L458 207"/>
  <path class="line" d="M577 244 L577 292"/>
  <path class="line" d="M577 412 L577 462"/>
  <path class="line" d="M458 500 L310 546"/>
  <path class="line" d="M696 352 L842 208"/>
  <path class="line" d="M706 352 L842 330"/>
  <path class="line" d="M696 376 L842 452"/>
  <path class="line" d="M961 246 L961 292"/>
  <path class="line" d="M961 368 L961 414"/>
  <path class="line" d="M961 490 L961 548"/>
  <path class="muted" d="M842 592 L696 518"/>
  <path class="dash" d="M842 330 C760 330 744 260 696 214"/>

  <text x="340" y="264" class="note">server-side API boundary</text>
  <text x="710" y="496" class="note">persist result, never trust browser-only state</text>
  <text x="724" y="198" class="note">existing customer context</text>

  <rect x="72" y="642" width="1008" height="34" rx="8" fill="#fff" stroke="#ead5dc"/>
  <text x="92" y="664" class="note">Design principle: AI drafts and answers within guardrails; workflow state, scheduling, admin permissions, and database writes remain controlled by backend logic.</text>
</svg>
